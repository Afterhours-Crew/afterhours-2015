[workspace]
members = [
    "crates/fire2",
    "crates/heat2",
    "crates/protocol",
    "crates/world-core",
    "crates/lsx-codec",
    "crates/storage",
    "crates/services",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
